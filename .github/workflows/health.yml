name: Health

# Once a day, ask production to walk its real path: OIDC token -> Vault -> short-lived database
# user -> one query. If Vault or Postgres is down the job fails, and GitHub emails the repo owner.
on:
  schedule:
    - cron: "17 14 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check production can reach Vault and Postgres
        run: |
          body=$(curl -sS --max-time 60 --retry 2 --retry-delay 10 https://claims-agent-eve.vercel.app/api/health)
          echo "$body"
          echo "$body" | grep -q '"ok":true'
